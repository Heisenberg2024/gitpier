name: Validate macOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Serialize main/tag for the same commit without consuming a waiting runner.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.sha || github.run_id }}
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      base: ${{ steps.plan.outputs.base }}
      reused_run: ${{ steps.plan.outputs.reused_run }}
      reused_attempt: ${{ steps.plan.outputs.reused_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI policy regression tests
        run: |
          python3 Scripts/test-ci-validation.py
          python3 Scripts/test-ci-cache-inputs.py
      - name: Select validation path
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci_validation.py plan
  build-test:
    # Keep the existing required-check name; planning failures must fail it too.
    needs: plan
    if: ${{ always() }}
    runs-on: ${{ (github.run_attempt > 1 || needs.plan.outputs.mode == 'full') && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 40
    env:
      # Failed-jobs-only reruns can retain an earlier successful plan's outputs.
      VALIDATION_MODE: ${{ github.run_attempt > 1 && 'full' || needs.plan.outputs.mode }}
    steps:
      - name: Require a valid plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          [[ "$PLAN_RESULT" == success ]] || exit 1
          case "$VALIDATION_MODE" in full|docs|reuse) ;; *) exit 1 ;; esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lightweight documentation checks
        if: env.VALIDATION_MODE == 'docs'
        env:
          VALIDATION_BASE: ${{ needs.plan.outputs.base }}
        run: python3 Scripts/ci_validation.py docs
      - name: Toolchain
        id: toolchain
        if: env.VALIDATION_MODE == 'full'
        run: |
          swift --version | tee "$RUNNER_TEMP/gitpier-toolchain.txt"
          xcodebuild -version >> "$RUNNER_TEMP/gitpier-toolchain.txt"
          xcrun --sdk macosx --show-sdk-build-version >> "$RUNNER_TEMP/gitpier-toolchain.txt"
          sw_vers -buildVersion >> "$RUNNER_TEMP/gitpier-toolchain.txt"
          /usr/bin/git --version
          gh --version
          task_cache_context="$(shasum -a 256 "$RUNNER_TEMP/gitpier-toolchain.txt" | cut -d ' ' -f 1)"
          printf 'cache-context=%s\n' "$task_cache_context" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM build cache
        id: swift-cache
        if: env.VALIDATION_MODE == 'full'
        uses: actions/cache/restore@v4
        timeout-minutes: 3
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: |
            .build
            .cache/swiftpm
            .cache/swift
            .cache/clang
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-v1-${{ steps.toolchain.outputs.cache-context }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**', 'Scripts/**', 'Resources/**', '.github/workflows/validate.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-v1-${{ steps.toolchain.outputs.cache-context }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Restore SwiftPM input timestamps
        if: env.VALIDATION_MODE == 'full'
        timeout-minutes: 1
        continue-on-error: true
        run: python3 Scripts/ci_cache_inputs.py restore --context "${{ steps.toolchain.outputs.cache-context }}"
      - name: Real Git repository tests
        id: core-tests
        if: env.VALIDATION_MODE == 'full'
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .cache/ci
          Scripts/test.sh --parallel --num-workers 2 --jobs 2 --disable-index-store --xunit-output .cache/ci/core-tests.xml 2>&1 | tee .cache/ci/core-tests.log
      - name: Upload test diagnostics
        if: ${{ !cancelled() && (steps.core-tests.outcome == 'success' || steps.core-tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: GitPier-core-tests-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .cache/ci/core-tests.xml
            .cache/ci/core-tests.log
          if-no-files-found: warn
      - name: Release metadata and signing gates
        if: env.VALIDATION_MODE != 'reuse'
        timeout-minutes: 2
        run: python3 Scripts/test-release-tools.py
      - name: Build application
        if: env.VALIDATION_MODE == 'full'
        timeout-minutes: 12
        run: Scripts/build-app.sh
      - name: Temporary DMG structure (no Finder visual claim)
        if: env.VALIDATION_MODE == 'full'
        timeout-minutes: 3
        run: Scripts/test-dmg-structure.sh
      - name: Archive development app preserving signatures and permissions
        if: env.VALIDATION_MODE == 'full'
        run: ditto -c -k --sequesterRsrc --keepParent dist/GitPier.app dist/GitPier-development.zip
      - name: Upload development app
        if: env.VALIDATION_MODE == 'full'
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: ${{ github.run_attempt > 1 && format('GitPier-development-app-attempt-{0}', github.run_attempt) || 'GitPier-development-app' }}
          path: dist/GitPier-development.zip
          if-no-files-found: error
      - name: Full macOS validation complete (v1)
        if: env.VALIDATION_MODE == 'full'
        run: echo 'All full macOS validation steps passed.'
      - name: Capture SwiftPM input timestamps
        if: ${{ success() && env.VALIDATION_MODE == 'full' && github.event_name == 'push' && steps.swift-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 1
        continue-on-error: true
        run: python3 Scripts/ci_cache_inputs.py capture --context "${{ steps.toolchain.outputs.cache-context }}"
      - name: Save SwiftPM build cache
        if: ${{ success() && env.VALIDATION_MODE == 'full' && github.event_name == 'push' && steps.swift-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: |
            .build
            .cache/swiftpm
            .cache/swift
            .cache/clang
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
      - name: Reused full validation
        if: env.VALIDATION_MODE == 'reuse'
        env:
          REUSED_RUN: ${{ needs.plan.outputs.reused_run }}
          REUSED_ATTEMPT: ${{ needs.plan.outputs.reused_attempt }}
        run: |
          [[ "$REUSED_RUN" =~ ^[0-9]+$ && "$REUSED_ATTEMPT" =~ ^[0-9]+$ ]] || exit 1
          echo "Full validation and development artifact: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$REUSED_RUN/attempts/$REUSED_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
